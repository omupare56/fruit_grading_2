services:
  - type: web
    name: fruitvision-ml
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/download_models.py
    startCommand: gunicorn backend.app:app -w 1 --timeout 120 -b 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLASK_ENV
        value: production
      - key: ML_INTERNAL_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: YOLO_MODEL_DOWNLOAD_URL
        sync: false
      - key: EFFICIENTNET_MODEL_DOWNLOAD_URL
        sync: false
